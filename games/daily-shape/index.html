<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Daily Shape — guess the country</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background:#f4f1ea; color:#20242e; min-height:100vh; }
  .wrap { max-width:520px; margin:0 auto; padding:20px 16px 40px; }
  h1 { text-align:center; font-size:34px; margin:18px 0 4px; letter-spacing:.5px; }
  .sub { text-align:center; color:#6b6f7a; margin:0 0 22px; font-size:15px; }
  .card { background:#fff; border-radius:18px; padding:18px; margin:12px 0;
          box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .btn { display:block; width:100%; border:none; border-radius:14px; padding:16px;
         font-size:18px; font-weight:700; margin:10px 0; cursor:pointer; }
  .btn-primary { background:#20242e; color:#fff; }
  .btn-secondary { background:#e9e4d8; color:#20242e; }
  .btn:active { transform:scale(.98); }
  .stats { display:flex; gap:10px; margin:12px 0; }
  .stat { flex:1; background:#fff; border-radius:14px; padding:12px; text-align:center;
          box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .stat .v { font-size:24px; font-weight:800; }
  .stat .l { font-size:12px; color:#6b6f7a; margin-top:2px; }
  .screen { display:none; } .screen.on { display:block; }
  #shapeCanvas { width:100%; height:300px; background:#fff; border-radius:18px;
                 box-shadow:0 2px 10px rgba(0,0,0,.06); display:block; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin:6px 2px 12px; }
  .topbar .pill { background:#fff; border-radius:999px; padding:8px 16px; font-weight:700;
                  box-shadow:0 2px 10px rgba(0,0,0,.06); font-size:15px; }
  .opt { display:block; width:100%; border:2px solid #e2ddd0; background:#fff; border-radius:14px;
         padding:16px; font-size:17px; font-weight:600; margin:8px 0; cursor:pointer; color:#20242e; }
  .opt.correct { background:#d9f2e2; border-color:#2f9e5f; color:#14532d; }
  .opt.wrong { background:#fbe3e3; border-color:#d64545; color:#7a1f1f; }
  .opt:disabled { cursor:default; }
  .big-score { text-align:center; font-size:64px; font-weight:800; margin:10px 0 0; }
  .rank-line { text-align:center; font-size:18px; font-weight:700; margin:6px 0 2px; }
  .rank-sub { text-align:center; color:#6b6f7a; font-size:14px; margin-bottom:8px; }
  .board-row { display:flex; justify-content:space-between; padding:10px 4px;
               border-bottom:1px solid #eee9db; font-size:16px; }
  .board-row.me { font-weight:800; }
  .board-row .r { color:#6b6f7a; width:52px; }
  .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45);
              align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal-bg.on { display:flex; }
  .modal { background:#fff; border-radius:18px; padding:22px; width:100%; max-width:380px; }
  .modal h2 { margin:0 0 6px; font-size:22px; }
  .modal p { color:#6b6f7a; font-size:14px; margin:6px 0 12px; }
  .modal input { width:100%; border:2px solid #e2ddd0; border-radius:12px; padding:14px;
                 font-size:17px; margin:6px 0; }
  .modal .err { color:#c0392b; font-size:14px; min-height:20px; margin:4px 0; }
  .tiny-link { display:block; text-align:center; color:#6b6f7a; font-size:14px;
               margin-top:14px; background:none; border:none; text-decoration:underline; cursor:pointer; }
  .note { font-size:13px; color:#6b6f7a; text-align:center; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- MENU -->
  <div id="screen-menu" class="screen on">
    <h1>🌍 Daily Shape</h1>
    <p class="sub">30 countries. Shape only. How many can you name?</p>
    <div class="stats">
      <div class="stat"><div class="v" id="stat-best">–</div><div class="l">BEST</div></div>
      <div class="stat"><div class="v" id="stat-streak">0</div><div class="l">DAY STREAK</div></div>
      <div class="stat"><div class="v" id="stat-name">?</div><div class="l">PLAYER</div></div>
    </div>
    <div class="card">
      <button class="btn btn-primary" id="btn-daily">▶ Play today's challenge</button>
      <button class="btn btn-secondary" id="btn-practice">Practice (random 30)</button>
      <button class="btn btn-secondary" id="btn-board">🏆 Leaderboard</button>
    </div>
    <button class="tiny-link" id="btn-name">Set / switch player name</button>
    <p class="note" id="menu-note"></p>
  </div>

  <!-- GAME -->
  <div id="screen-game" class="screen">
    <div class="topbar">
      <div class="pill" id="game-round">1/30</div>
      <div class="pill" id="game-mode">DAILY</div>
      <div class="pill" id="game-score">0 ✅</div>
    </div>
    <canvas id="shapeCanvas" width="640" height="600"></canvas>
    <div id="options" style="margin-top:12px;"></div>
  </div>

  <!-- DONE -->
  <div id="screen-done" class="screen">
    <div class="card">
      <p class="sub" id="done-title" style="margin-bottom:0">Today's challenge</p>
      <div class="big-score" id="done-score">0/30</div>
      <div class="rank-line" id="done-rank"></div>
      <div class="rank-sub" id="done-rank-sub"></div>
      <button class="btn btn-primary" id="btn-share">📤 Share result</button>
      <button class="btn btn-secondary" id="btn-board2">🏆 Leaderboard</button>
      <button class="btn btn-secondary" id="btn-menu">Menu</button>
    </div>
    <p class="note" id="done-note"></p>
  </div>

  <!-- LEADERBOARD -->
  <div id="screen-board" class="screen">
    <h1 style="font-size:26px">🏆 Leaderboard</h1>
    <p class="sub" id="board-date"></p>
    <div class="card" id="board-list"></div>
    <button class="btn btn-secondary" id="btn-menu2">Menu</button>
  </div>

</div>

<!-- NAME MODAL -->
<div class="modal-bg" id="modal-name">
  <div class="modal">
    <h2 id="name-h">Pick your player name</h2>
    <p id="name-p">Names are first come, first served across all Mini Games.</p>
    <input id="name-input" maxlength="16" placeholder="e.g. HoopsFan23" autocomplete="off">
    <input id="name-phrase" type="password" placeholder="Secret phrase (min 4 chars)" style="display:none">
    <div class="err" id="name-err"></div>
    <button class="btn btn-primary" id="name-go">Continue</button>
    <button class="tiny-link" id="name-cancel">Cancel</button>
    <p class="note">Don't lose your phrase — there's no reset.</p>
  </div>
</div>

  return seededShuffle(idx,rand).slice(0,30);
}
function roundOptions(dateStr,round,correctIdx){
  var rand=mulberry32(xmur3('dailyshape|'+dateStr+'|r'+round)());
  var set={}; set[correctIdx]=1; var n=1;
  while(n<4){var c=Math.floor(rand()*COUNTRIES.length); if(!set[c]){set[c]=1;n++;}}
  return seededShuffle(Object.keys(set).map(Number),rand);
}
function shareText(dateStr,results){
  var score=results.filter(Boolean).length;
  var grid='';
  results.forEach(function(r,i){grid+=r?'🟩':'🟥'; if((i+1)%10===0&&i<results.length-1)grid+='\n';});
  return 'Daily Shape '+dateStr+'\n'+score+'/'+results.length+'\n'+grid;
}

/* ================= local storage ================= */
var LS='dailyshape.v1', ULS='dailyshape.user';
function loadStats(){try{return JSON.parse(localStorage.getItem(LS))||{};}catch(e){return{};}}
function saveStats(s){try{localStorage.setItem(LS,JSON.stringify(s));}catch(e){}}
function recordDaily(dateStr,score){
  var s=loadStats();
  if(s.lastPlayed===dateStr) return {replay:true,best:s.best||0,streak:s.streak||0};
  var y=new Date(); y.setDate(y.getDate()-1);
  var streak=(s.lastPlayed===todayStr(y))?(s.streak||0)+1:1;
  var ns={best:Math.max(s.best||0,score),streak:streak,lastPlayed:dateStr};
  saveStats(ns);
  return {replay:false,best:ns.best,streak:ns.streak};
}
function loadUser(){try{return JSON.parse(localStorage.getItem(ULS));}catch(e){return null;}}
function saveUser(u){try{localStorage.setItem(ULS,JSON.stringify(u));}catch(e){}}
function clearUser(){try{localStorage.removeItem(ULS);}catch(e){}}
function validNameLocal(n){n=String(n||'').trim();return n.length>=1&&n.length<=16&&/^[A-Za-z0-9 ]+$/.test(n);}
async function sha256hex(str){
  var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,'0');}).join('');
}

/* ================= leaderboard client ================= */
var LEADERBOARD_URL=''; // <-- paste the Apps Script web-app URL here to go live
function apiGet(params){
  if(!LEADERBOARD_URL) return Promise.reject(new Error('no-url'));
  var ctl=new AbortController(); var t=setTimeout(function(){ctl.abort();},8000);
  var q=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
  return fetch(LEADERBOARD_URL+'?'+q,{signal:ctl.signal}).then(function(r){clearTimeout(t);return r.json();});
}
function apiPost(body){
  if(!LEADERBOARD_URL) return Promise.reject(new Error('no-url'));
  var ctl=new AbortController(); var t=setTimeout(function(){ctl.abort();},8000);
  return fetch(LEADERBOARD_URL,{method:'POST',body:JSON.stringify(body),signal:ctl.signal})
    .then(function(r){clearTimeout(t);return r.json();});
}
function submitDaily(dateStr,score){
  var u=loadUser();
  if(!LEADERBOARD_URL||!u||!u.hash) return Promise.resolve({local:true});
  return apiPost({action:'submit',game:'daily-shape',date:dateStr,username:u.display,hash:u.hash,score:score})
    .catch(function(e){return {local:true,error:String(e)};});
}

/* ================= rendering ================= */
function drawCountry(canvas,idx){
  var c=COUNTRIES[idx];
  var ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  var mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9,i,j,p,poly;
  for(i=0;i<c.p.length;i++){poly=c.p[i];for(j=0;j<poly.length;j++){p=poly[j];
    if(p[0]<mnx)mnx=p[0]; if(p[0]>mxx)mxx=p[0]; if(p[1]<mny)mny=p[1]; if(p[1]>mxy)mxy=p[1];}}
  var pad=30;
  var s=Math.min((W-2*pad)/((mxx-mnx)||1),(H-2*pad)/((mxy-mny)||1));
  var cx=(mnx+mxx)/2, cy=(mny+mxy)/2;
  ctx.fillStyle='#20242e';
  for(i=0;i<c.p.length;i++){poly=c.p[i];ctx.beginPath();
    for(j=0;j<poly.length;j++){p=poly[j];
      var x=W/2+(p[0]-cx)*s, y=H/2-(p[1]-cy)*s;
      if(j)ctx.lineTo(x,y);else ctx.moveTo(x,y);}
    ctx.closePath();ctx.fill();}
}

/* ================= screens ================= */
var G=null; // current game state
function show(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on');});
  el(id).classList.add('on');
  window.scrollTo(0,0);
}
function refreshMenu(){
  var s=loadStats(), u=loadUser();
  el('stat-best').textContent=(s.best||0)+'/30';
  el('stat-streak').textContent=s.streak||0;
  el('stat-name').textContent=u?u.display:'?';
  el('menu-note').textContent=LEADERBOARD_URL?'':'Leaderboard not connected yet — scores stay on this device.';
  var playedToday=s.lastPlayed===todayStr();
  el('btn-daily').textContent=playedToday?'▶ Play today again (practice run)':"▶ Play today's challenge";
}
function startGame(mode){
  var date=todayStr();
  var set,seedLabel;
  if(mode==='daily'){set=dailySet(date);seedLabel='DAILY';}
  else{var r=mulberry32((Math.random()*1e9)|0);set=seededShuffle(COUNTRIES.map(function(_,i){return i;}),r).slice(0,30);seedLabel='PRACTICE';}
  G={mode:mode,date:date,set:set,round:0,score:0,results:[],locked:false,submitted:false};
  el('game-mode').textContent=seedLabel;
  show('screen-game');
  nextRound();
}
function nextRound(){
  if(G.round>=30){finishGame();return;}
  G.locked=false;
  var correct=G.set[G.round];
  var opts=roundOptions(G.mode==='daily'?G.date:'practice|'+Date.now(),G.round,correct);
  el('game-round').textContent=(G.round+1)+'/30';
  el('game-score').textContent=G.score+' ✅';
  drawCountry(el('shapeCanvas'),correct);
  var box=el('options'); box.innerHTML='';
  opts.forEach(function(ci){
    var b=document.createElement('button');
    b.className='opt'; b.textContent=COUNTRIES[ci].n;
    b.onclick=function(){answer(b,ci===correct,correct);};
    box.appendChild(b);
  });
}
function answer(btn,hit,correct){
  if(G.locked)return; G.locked=true;
  G.results.push(hit); if(hit)G.score++;
  el('game-score').textContent=G.score+' ✅';
  var btns=el('options').children;
  for(var i=0;i<btns.length;i++){
    btns[i].disabled=true;
    if(btns[i].textContent===COUNTRIES[correct].n)btns[i].classList.add('correct');
  }
  if(!hit)btn.classList.add('wrong');
  setTimeout(function(){G.round++;nextRound();},hit?450:900);
}
function finishGame(){
  var s=loadStats();
  if(G.mode==='daily'){
    var rec=recordDaily(G.date,G.score);
    el('done-title').textContent="Today's challenge";
    el('done-note').textContent=rec.replay?'Already played today — this run was just for fun.':'Saved! Come back tomorrow to keep your streak.';
    maybeSubmit();
  }else{
    el('done-title').textContent='Practice round';
    el('done-note').textContent='Practice never touches your stats or the leaderboard.';
    el('done-rank').textContent=''; el('done-rank-sub').textContent='';
  }
  el('done-score').textContent=G.score+'/30';
  show('screen-done');
}
function maybeSubmit(){
  var u=loadUser();
  if(G.submitted)return;
  if(!u){
    el('done-rank').textContent='';
    el('done-rank-sub').textContent='';
    var b=document.createElement('button');
    b.className='btn btn-secondary'; b.id='btn-claimpost';
    b.textContent='Set player name to post your score';
    b.onclick=function(){openNameModal(function(){maybeSubmit();});};
    el('done-rank').appendChild(b);
    return;
  }
  G.submitted=true;
  el('done-rank').textContent='Posting…';
  submitDaily(G.date,G.score).then(function(res){
    if(res.local||!res.ok){
      el('done-rank').textContent='';
      el('done-rank-sub').textContent=LEADERBOARD_URL?'Could not reach leaderboard — kept locally.':'Leaderboard not connected yet.';
      return;
    }
    el('done-rank').textContent='P'+res.rank+' of '+res.count+' today';
    el('done-rank-sub').textContent=res.percentile+'th percentile vs everyone today';
  });
}
function loadBoard(){
  el('board-date').textContent=todayStr();
  var list=el('board-list');
  if(!LEADERBOARD_URL){list.innerHTML='<p class="sub">Leaderboard not connected yet.</p>';show('screen-board');return;}
  list.innerHTML='<p class="sub">Loading…</p>'; show('screen-board');
  apiGet({action:'board',game:'daily-shape',date:todayStr()}).then(function(res){
    if(!res.ok||!res.count){list.innerHTML='<p class="sub">No scores yet today — be the first!</p>';return;}
    var u=loadUser();
    var html='';
    res.entries.forEach(function(e,i){
      var me=u&&e.display.toLowerCase()===u.display.toLowerCase();
      html+='<div class="board-row'+(me?' me':'')+'"><span class="r">P'+(i+1)+'</span><span>'+escapeHtml(e.display)+'</span><span>'+e.score+'/30</span></div>';
    });
    list.innerHTML=html;
  }).catch(function(){list.innerHTML='<p class="sub">Could not load leaderboard.</p>';});
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ================= name modal (claim flow) ================= */
var nameCb=null, nameStage='name', nameChecked=null;
function openNameModal(cb){
  nameCb=cb||null; nameStage='name'; nameChecked=null;
  el('name-h').textContent='Pick your player name';
  el('name-p').textContent='Names are first come, first served across all Mini Games.';
  el('name-input').style.display=''; el('name-input').value=(loadUser()||{}).display||'';
  el('name-phrase').style.display='none'; el('name-phrase').value='';
  el('name-err').textContent='';
  el('modal-name').classList.add('on');
  setTimeout(function(){el('name-input').focus();},100);
}
function closeNameModal(){el('modal-name').classList.remove('on');}
function nameGo(){
  var err=el('name-err');
  var name=el('name-input').value.trim();
  if(nameStage==='name'){
    if(!validNameLocal(name)){err.textContent='Letters, numbers and spaces only (max 16).';return;}
    if(!LEADERBOARD_URL){ // offline: local-only name
      saveUser({display:name,key:name.toLowerCase(),hash:null,localOnly:true});
      closeNameModal(); refreshMenu(); if(nameCb)nameCb(); return;
    }
    err.textContent='Checking…';
    apiGet({action:'check',username:name}).then(function(res){
      if(!res.ok){err.textContent='Could not reach server. Try again.';return;}
      nameChecked={name:name,taken:res.taken};
      nameStage='phrase';
      el('name-input').style.display='none';
      el('name-phrase').style.display='';
      el('name-h').textContent=res.taken?'Name taken':'This name is yours';
      el('name-p').textContent=res.taken
        ?'Enter its secret phrase to use it.'
        :'Set a secret phrase (min 4 chars) to lock it in. Don\'t lose it — there\'s no reset.';
      err.textContent='';
      el('name-phrase').focus();
    }).catch(function(){err.textContent='Could not reach server. Try again.';});
    return;
  }
  // phrase stage
  var phrase=el('name-phrase').value;
  if(phrase.length<4){err.textContent='Phrase needs at least 4 characters.';return;}
  err.textContent='Saving…';
  var key=nameChecked.name.toLowerCase();
  sha256hex(key+'|'+phrase).then(function(hash){
    return apiPost({action:'claim',username:nameChecked.name,hash:hash}).then(function(res){
      if(!res.ok){
        err.textContent=res.error==='wrong_phrase'?'Wrong phrase for that name.':'Could not claim that name.';
        return;
      }
      saveUser({display:nameChecked.name,key:key,hash:hash});
      closeNameModal(); refreshMenu(); if(nameCb)nameCb();
    });
  }).catch(function(){err.textContent='Something went wrong. Try again.';});
}

/* ================= wire up ================= */
document.addEventListener('DOMContentLoaded',function(){
  el('btn-daily').onclick=function(){startGame('daily');};
  el('btn-practice').onclick=function(){startGame('practice');};
  el('btn-board').onclick=loadBoard;
  el('btn-board2').onclick=loadBoard;
  el('btn-menu').onclick=function(){refreshMenu();show('screen-menu');};
  el('btn-menu2').onclick=function(){refreshMenu();show('screen-menu');};
  el('btn-name').onclick=function(){openNameModal();};
  el('name-go').onclick=nameGo;
  el('name-cancel').onclick=closeNameModal;
  el('btn-share').onclick=function(){
    var t=shareText(G.date,G.results);
    if(navigator.share){navigator.share({text:t}).catch(function(){});}
    else if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){el('btn-share').textContent='✅ Copied!';});}
  };
  refreshMenu();
});
</script>
